      <stop offset="0%" stop-color="#071324"/>
      <stop offset="52%" stop-color="#0c223b"/>
      <stop offset="100%" stop-color="#08172b"/>
    </linearGradient>
    <radialGradient id="glow-warm" cx="84%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#ff8f7e" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ff8f7e" stop-opacity="0.05"/>
